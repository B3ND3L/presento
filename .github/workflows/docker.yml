name: Docker Image CI

# Build de validation sur les PR (sans push) et publication des tags
# « roulants » (unstable / pre-alpha) sur main. Le tag versionné `X.Y.Z`
# et `latest` sont gérés par le workflow Release (release.yml).

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Lowercase image name
      id: img
      run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
      env:
        IMAGE_NAME: ${{ env.IMAGE_NAME }}
    - name: Log in to the Container registry
      # Pas de login sur les PR issues de forks (pas de droits de push)
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        # Push uniquement sur main, simple build de validation sur les PR
        push: ${{ github.event_name == 'push' }}
        tags: |
          ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:unstable
          ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:beta
