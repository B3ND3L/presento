services:

  presento:
    image: ghcr.io/b3nd3l/presento:latest
    build: .
    ports:
      - 8000:8000
    environment:
      - MONGO_URI=mongo-database:27017

  mongo-database:
    image: mongo:8.3.2
    container_name: mongodb
    restart: always
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb

volumes:
  mongo-data:
    driver: local
  mongo-config:
    driver: local