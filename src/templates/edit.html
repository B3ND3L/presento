<!DOCTYPE html>
<html lang="fr" class="editor">
<head>
    <meta charset="utf-8">
    <title>Éditer — {{ pres.meta.title }}</title>
    <link rel="icon" href="{{ url_for('assets', path='/favicon.ico') }}" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('assets', path='styles.css') }}" type="text/css">
</head>
<body class="editor">

<!-- ══════════════════════════════════════════════
     TOPBAR
══════════════════════════════════════════════ -->
<div id="topbar">
    <div class="tb-left">
        <a href="/" class="btn btn-ghost">←</a>
        <input id="pres-title" type="text" value="{{ pres.meta.title }}" spellcheck="false">
        <span id="save-status">{{ _("save_status") }}</span>
    </div>
    <div class="tb-right">
        <select class="ft-select ft-select--theme" id="theme-select"
                title="{{ _('theme') }}" onchange="onThemeChange(this.value)">
            <option value="white">White</option>
            <option value="black">Black</option>
            <option value="beige">Beige</option>
            <option value="moon">Moon</option>
            <option value="sky">Sky</option>
            <option value="solarized">Solarized</option>
            <option value="league">League</option>
            <option value="serif">Serif</option>
        </select>
        <button class="btn btn-ghost" onclick="togglePropPanel()" title="{{ _('slide_parameters') }}">⚙</button>
        <button class="btn btn-stroke" onclick="copyShareLink()">{{ _("share") }}</button>
        <a href="/p/{{ pres.id }}?print-pdf" target="_blank" class="btn btn-stroke">{{ _("pdf") }}</a>
        <a href="/p/{{ pres.id }}" target="_blank" class="btn btn-stroke">{{ _("run") }}</a>
        <button class="btn btn-accent" onclick="openSaveModal()">{{ _("save") }}</button>
    </div>
</div>

<!-- ══════════════════════════════════════════════
     FORMAT TOOLBAR
══════════════════════════════════════════════ -->
<div id="format-toolbar">
    <div class="ft-section" data-ctx="text">
        <select class="ft-select ft-select--font" id="font-family"
                onchange="applyStyle('fontFamily', this.value)">
            <option value="inherit">— {{ _("font") }} —</option>
            <option value="Georgia, serif">Georgia</option>
            <option value="'DM Sans', sans-serif">DM Sans</option>
            <option value="'Courier New', monospace">Courier New</option>
            <option value="Impact, sans-serif">Impact</option>
            <option value="'Times New Roman', serif">Times New Roman</option>
        </select>
        <select class="ft-select ft-select--size" id="font-size"
                onchange="applyStyle('fontSize', this.value + 'px')">
            <option value="">{{ _("size") }}</option>
            <option value="12">12</option><option value="14">14</option>
            <option value="16">16</option><option value="18">18</option>
            <option value="20">20</option><option value="24">24</option>
            <option value="28">28</option><option value="32">32</option>
            <option value="36">36</option><option value="48">48</option>
            <option value="64">64</option><option value="80">80</option>
            <option value="96">96</option>
        </select>
        <div class="ft-sep"></div>
        <button class="ft-btn" id="btn-bold"   onclick="execCmd('bold')"          title="{{ _('bold') }} (Ctrl+B)"><b>B</b></button>
        <button class="ft-btn" id="btn-italic" onclick="execCmd('italic')"        title="{{ _('italic') }} (Ctrl+I)"><i>I</i></button>
        <button class="ft-btn" id="btn-under"  onclick="execCmd('underline')"     title="{{ _('underline') }} (Ctrl+U)"><u>U</u></button>
        <button class="ft-btn" id="btn-strike" onclick="execCmd('strikeThrough')" title="{{ _('crossed') }}"><s>S</s></button>
        <div class="ft-sep"></div>
        <button class="ft-btn" onclick="execCmd('justifyLeft')"   title="{{ _('align_left') }}">⬅</button>
        <button class="ft-btn" onclick="execCmd('justifyCenter')" title="{{ _('center') }}">☰</button>
        <button class="ft-btn" onclick="execCmd('justifyRight')"  title="{{ _('align_right') }}">➡</button>
        <div class="ft-sep"></div>
        <div class="ft-color-btn" title="{{ _('text_color') }}">
            <div class="ft-color-preview" id="color-preview"></div>
            <input type="color" id="text-color" value="#000000" oninput="applyTextColor(this.value)">
        </div>
        <div class="ft-color-btn" title="{{ _('element_background_color') }}">
            <div class="ft-color-preview ft-color-preview--dashed" id="bg-color-preview"></div>
            <input type="color" id="bg-color" value="#ffffff" oninput="applyBgColor(this.value)">
        </div>
    </div>
    <div class="ft-sep"></div>

    <span class="ft-label">{{ _("background") }}</span>
    <div class="ft-color-btn" title="{{ _('background_color') }}">
        <div class="ft-color-preview" id="slide-bg-preview"></div>
        <input type="color" id="slide-bg-color" value="#ffffff" oninput="applySlideBackground(this.value)">
    </div>
    <div class="ft-sep"></div>

    <button class="ft-btn btn-action-on-el" onclick="bringForward()"    title="{{ _('forward') }}">⬆</button>
    <button class="ft-btn btn-action-on-el" onclick="sendBackward()"    title="{{ _('backward') }}">⬇</button>
    <div class="ft-sep"></div>
    <button class="ft-btn btn-action-on-el" id="btn-fragment" onclick="toggleFragment()" title="{{ _('progressive') }}">✨</button>
    <button class="ft-btn" id="btn-edit-iframe" onclick="openIframeModal(true)" title="{{ _('iframe_url') }}">🪟</button>
    <div class="ft-sep"></div>
    <button class="ft-btn btn-action-on-el" id="btn-delete-el" onclick="deleteSelected()" title="{{ _('delete_element') }}">🗑️</button>

    <div class="ft-spacer"></div>
    <div id="zoom-label">100%</div>
    <input type="range" id="zoom-range" min="40" max="150" value="100" oninput="setZoom(this.value)">
</div>

<!-- ══════════════════════════════════════════════
     SLIDE PANEL (left)
══════════════════════════════════════════════ -->
<div id="slide-panel">
    <div class="sp-header">
        <span>Slides</span>
        <button class="sp-add-btn" onclick="addSlide()" title="{{ _('add_slide') }}">+</button>
    </div>
    <div id="slide-list"></div>
</div>

<!-- ══════════════════════════════════════════════
     CANVAS
══════════════════════════════════════════════ -->
<div id="canvas-area">
    <div id="slide-canvas"
         onclick="onCanvasClick(event)"
         ondragover="onDragOver(event)"
         ondrop="onDrop(event)">
        <div id="empty-hint">
            <div class="hint-icon">✦</div>
            <p>{{ _("slide_placeholder") }}</p>
        </div>
    </div>
</div>

<!-- ══════════════════════════════════════════════
     INSERT FAB
══════════════════════════════════════════════ -->
<button id="insert-fab" onclick="toggleInsertMenu()" title="{{ _('insert') }}">+</button>
<div id="insert-menu">
    <button class="im-item" onclick="insertText('heading');    closeInsertMenu()"><span class="im-icon">T</span> {{ _("title") }}</button>
    <button class="im-item" onclick="insertText('body');       closeInsertMenu()"><span class="im-icon">¶</span> {{ _("text") }}</button>
    <button class="im-item" onclick="insertText('bullet');     closeInsertMenu()"><span class="im-icon">•</span> {{ _("list") }}</button>
    <button class="im-item" onclick="openImageModal();         closeInsertMenu()"><span class="im-icon">🖼</span> {{ _("url_image") }}</button>
    <button class="im-item" onclick="triggerImageUpload();     closeInsertMenu()"><span class="im-icon">📁</span> {{ _("file_image") }}</button>
    <button class="im-item" onclick="openIframeModal(false);   closeInsertMenu()"><span class="im-icon">🌐</span> {{ _("iframe") }}</button>
    <button class="im-item" onclick="insertShape('rect');      closeInsertMenu()"><span class="im-icon">▬</span> {{ _("rectangle") }}</button>
    <button class="im-item" onclick="insertShape('circle');    closeInsertMenu()"><span class="im-icon">●</span> {{ _("circle") }}</button>
    <button class="im-item" onclick="insertShape('triangle');  closeInsertMenu()"><span class="im-icon">▲</span> {{ _("triangle") }}</button>
    <button class="im-item" onclick="insertDivider();          closeInsertMenu()"><span class="im-icon">━</span> {{ _("line") }}</button>
</div>
<input type="file" id="image-upload" accept="image/*" class="input-hidden" onchange="handleImageFile(event)">

<!-- ══════════════════════════════════════════════
     PROP PANEL (right)
══════════════════════════════════════════════ -->
<div id="prop-panel">
    <div class="pp-header">
        <span>{{ _("slide_parameters") }}</span>
        <button class="pp-close" onclick="togglePropPanel()">✕</button>
    </div>
    <div class="pp-body">
        <div class="pp-group">
            <label>{{ _("background_color") }}</label>
            <input type="color" id="pp-slide-bg" class="pp-color" value="#ffffff"
                   oninput="applySlideBackground(this.value)">
            <div class="pp-swatches" id="bg-swatches"></div>
        </div>
        <div class="pp-group">
            <label>{{ _("transition") }}</label>
            <select class="pp-input" id="pp-transition" onchange="onTransitionChange(this.value)">
                <option value="slide">{{ _("slide") }}</option>
                <option value="fade">{{ _("fade") }}</option>
                <option value="zoom">{{ _("zoom") }}</option>
                <option value="convex">{{ _("convex") }}</option>
                <option value="concave">{{ _("concave") }}</option>
                <option value="none">{{ _("none") }}</option>
            </select>
        </div>
        <div class="pp-group">
            <label>{{ _("theme") }}</label>
            <div class="theme-grid" id="pp-themes"></div>
        </div>
    </div>
</div>

<!-- ══════════════════════════════════════════════
     MODALS
══════════════════════════════════════════════ -->

<!-- Image URL -->
<div class="modal-overlay" id="modal-image">
    <div class="modal">
        <h3>{{ _("insert_image") }}</h3>
        <div class="modal-field">
            <label>{{ _("image_url") }}</label>
            <input type="text" id="img-url-input" placeholder="https://...">
        </div>
        <div class="modal-actions">
            <button class="btn btn-ghost" onclick="closeModal('image')">{{ _("cancel") }}</button>
            <button class="btn btn-accent" onclick="insertImageFromUrl()">{{ _("ok") }}</button>
        </div>
    </div>
</div>

<!-- iFrame -->
<div class="modal-overlay" id="modal-iframe">
    <div class="modal">
        <h3 id="iframe-modal-title">{{ _("insert_iframe") }}</h3>
        <div class="modal-field">
            <label>{{ _("url_to_display") }}</label>
            <input type="text" id="iframe-url-input" placeholder="https://...">
        </div>
        <div class="modal-actions">
            <button class="btn btn-ghost" onclick="closeModal('iframe')">{{ _("cancel") }}</button>
            <button class="btn btn-accent" onclick="confirmIframeModal()">{{ _("ok") }}</button>
        </div>
    </div>
</div>

<!-- Save -->
<div class="modal-overlay" id="modal-save">
    <div class="modal">
        <h3>{{ _("save") }}</h3>
        <div class="save-tabs">
            <button class="save-tab active" onclick="switchSaveTab('online')">{{ _("online") }}</button>
            <button class="save-tab"        onclick="switchSaveTab('offline')">{{ _("offline") }}</button>
        </div>

        <div class="save-pane active" id="save-pane-online">
            <p class="save-hint">{{ _("save_online_hint") }}</p>
            <div class="save-id-box">
                <code id="save-pres-id">{{ pres.id }}</code>
                <button onclick="copyPresId()" title="{{ _('copy_id') }}">📋</button>
            </div>
            <div class="modal-field">
                <label>{{ _("password_optional") }}</label>
                <input type="password" id="save-password" placeholder="{{ _('password_leave_empty') }}">
            </div>
            <div class="modal-field">
                <label>{{ _("confirm_password") }}</label>
                <input type="password" id="save-password-confirm">
            </div>
            <div id="save-online-error" class="save-error"></div>
            <div class="modal-actions">
                <button class="btn btn-ghost" onclick="closeModal('save')">{{ _("cancel") }}</button>
                <button class="btn btn-accent" onclick="saveOnline()">{{ _("save_online") }}</button>
            </div>
        </div>

        <div class="save-pane" id="save-pane-offline">
            <div class="offline-icon">📦</div>
            <p class="offline-desc">{{ _("save_offline_desc") }}</p>
            <div class="modal-actions modal-actions--center">
                <button class="btn btn-ghost" onclick="closeModal('save')">{{ _("cancel") }}</button>
                <button class="btn btn-accent" onclick="saveOffline()">{{ _("download_json") }}</button>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- ══════════════════════════════════════════════
     SCRIPTS
══════════════════════════════════════════════ -->
<script src="{{ url_for('assets', path='js/edit.js') }}"></script>
<script>
  /* ═════════════════════════════════════════════════════
   STATE
═════════════════════════════════════════════════════ */

const SLIDE_W    = 960;
const SLIDE_H    = 540;
const REVEAL_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0';

const _themeCache = {};
let   _probeIframe = null;

/* ═════════════════════════════════════════════════════
   BOOT
═════════════════════════════════════════════════════ */
(function boot() {
    const INITIAL_SLIDES = {{ pres.slides | tojson }};
    state.id = "{{ pres.id }}"
    state.title      = {{ pres.meta.title      | tojson }};
    state.theme      = {{ pres.meta.theme      | tojson }};
    state.transition = {{ pres.meta.transition | tojson }};
    state.slides     = INITIAL_SLIDES.length ? INITIAL_SLIDES : [emptySlide()];

    state.slides.forEach(s => s.elements.forEach(e => {
        const num = parseInt(e.id.replace('el_',''));
        if (!isNaN(num) && num > elCounter) elCounter = num;
    }));

    document.getElementById('pres-title').value  = state.title;
    document.getElementById('theme-select').value = state.theme;
    document.getElementById('pp-transition').value = state.transition;

    buildPropPanel();
    renderSlideList();
    renderCurrentSlide();

    const availW  = window.innerWidth  - 220 - 80;
    const availH  = window.innerHeight -  52 - 44 - 80;
    const fitZoom = Math.min(availW / SLIDE_W, availH / SLIDE_H, 1) * 100;
    document.getElementById('zoom-range').value = Math.round(fitZoom);
    setZoom(Math.round(fitZoom));
})();
</script>
</body>
</html>
