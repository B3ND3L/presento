<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presento</title>
    <link rel="icon" href="{{ url_for('assets', path='/favicon.ico') }}" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('assets', path='css/tokens.css') }}" type="text/css">
    <link rel="stylesheet" href="{{ url_for('assets', path='css/base.css') }}" type="text/css">
    <link rel="stylesheet" href="{{ url_for('assets', path='css/index.css') }}" type="text/css">

    <!-- Apply the theme before rendering (avoids any flash) -->
    <script src="{{ url_for('assets', path='js/theme.js') }}"></script>
</head>
<body>

<header class="topbar">
    <div class="topbar-logo">
        <div class="topbar-logo-mark">
            <img src="{{ url_for('assets', path='presento_logo.png') }}" alt="Presento">
        </div>
        <span class="topbar-logo-text">PRESENTO</span>
        <span class="topbar-logo-badge">beta v0.1.0</span>
    </div>

    <div class="topbar-actions">
        <button class="theme-toggle" id="themeToggle" title="{{ _('toggle_theme') }}" aria-label="{{ _('toggle_theme') }}">
            <span class="icon-moon">🌙</span><span class="icon-sun">☀️</span>
        </button>

        <div class="lang-dropdown" id="langDropdown">
            <button class="lang-trigger" id="langTrigger">
                <span id="langFlag">{{ _("emoji_language") }}</span>
                <span id="langLabel">{{ _("language") }}</span>
                <span class="chevron">▾</span>
            </button>
            <div class="lang-menu" id="langMenu">
                <button class="lang-opt {% if lang == 'fr' %}active{% endif %}" data-lang="fr" data-flag="🇫🇷" data-label="Français">🇫🇷 Français</button>
                <button class="lang-opt {% if lang == 'en' %}active{% endif %}" data-lang="en" data-flag="🇬🇧" data-label="English">🇬🇧 English</button>
            </div>
        </div>
    </div>
</header>

<div class="container">
    <div class="hero">
        <h1>{{ _("site_title") }}</h1>
        <p class="subtitle">{{ _("slogan") }}</p>
        <div class="hero-actions">
            <form action="/pres/new" method="post">
                <button type="submit" class="btn btn-primary">{{ _("add_slide") }}</button>
            </form>
        </div>
    </div>

    <h2 class="section-title">{{ _("slides_access") }}</h2>
    <div class="action-grid">

        <div class="action-card">
            <h4>{{ _("id_access") }}</h4>
            <p>{{ _("online_desc") }}</p>

            <div id="access-error" class="alert alert-error alert--hidden"></div>

            <div class="form-row">
                <input class="form-input" type="text" id="access-id"
                       placeholder="{{ _('id_placeholder') }}">
            </div>
            <div class="form-row">
                <input class="form-input" type="password" id="access-password"
                       placeholder="{{ _('password_placeholder') }}">
            </div>
            <button type="button" class="btn btn-primary action-btn-full" id="access-btn">
                {{ _("access") }}
            </button>
        </div>

        <div class="action-card">
            <h4>{{ _("import_json") }}</h4>
            <p>{{ _("load_offline") }}</p>

            <div id="import-error" class="alert alert-error alert--hidden"></div>

            <div id="import-dropzone" class="dropzone" tabindex="0"
                 role="button" aria-label="{{ _('dropzone_hint') }}">
                <input type="file" id="import-file" class="input-hidden"
                       accept=".json,application/json">
                <span class="dropzone-icon" aria-hidden="true">📥</span>
                <span class="dropzone-text" id="dropzone-text">{{ _("dropzone_hint") }}</span>
                <span class="dropzone-browse">{{ _("browse") }}</span>
            </div>

            <button type="button" class="btn btn-primary action-btn-full" id="import-btn">
                {{ _("import_edit") }}
            </button>
        </div>

    </div>

    <h2 class="section-title">{{ _("my_slides") }}</h2>

    <div id="my-slides"></div>
    <div id="my-slides-empty" class="empty alert--hidden">{{ _("no_slide") }}</div>
</div>

<!-- Translations exposed to JavaScript -->
<script id="presento-i18n" type="application/json">
{
    "select_json_file":    {{ _("select_json_file")    | tojson }},
    "invalid_json":        {{ _("invalid_json")        | tojson }},
    "unrecognized_format": {{ _("unrecognized_format") | tojson }},
    "import_error":        {{ _("import_error")        | tojson }},
    "dropzone_hint":       {{ _("dropzone_hint")       | tojson }},
    "view_slide":          {{ _("view_slide")          | tojson }},
    "edit":                {{ _("edit")                | tojson }},
    "pdf":                 {{ _("pdf")                 | tojson }},
    "delete":              {{ _("delete")              | tojson }},
    "confirm_delete":      {{ _("confirm_delete")      | tojson }},
    "password_protected":  {{ _("password_protected")  | tojson }},
    "access_empty":        {{ _("access_empty")        | tojson }},
    "access_not_found":    {{ _("access_not_found")    | tojson }},
    "access_bad_password": {{ _("access_bad_password") | tojson }}
}
</script>

<script src="{{ url_for('assets', path='js/index.js') }}"></script>
</body>
</html>
